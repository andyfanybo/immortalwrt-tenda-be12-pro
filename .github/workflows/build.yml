name: Build BE12 Pro - Open Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/source.env'
      - 'config/feeds.conf'
      - 'config/be12-pro.config'
      - 'files/**'
      - 'files-open-source/**'
      - 'scripts/prepare.sh'
      - 'scripts/collect.sh'
      - 'scripts/publish-release.sh'
      - 'scripts/reserve-release-tag.sh'

permissions:
  contents: write

jobs:
  reserve_release_tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reserve tag before long build queues
        id: reserve
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: bash scripts/reserve-release-tag.sh open-source

  build:
    needs: reserve_release_tag
    concurrency:
      group: be12-pro-open-source-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}/openwrt
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Linux build environment
        run: |
          set -euxo pipefail
          # Only remove unused, preinstalled tools from the disposable runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl xz-utils zstd libelf-dev \
            autoconf automake libtool pkgconf libyaml-dev
          df -h

      - name: Restore source archives and Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-open-source-dl-v1-${{ hashFiles('config/source.env', 'config/feeds.conf', 'config/be12-pro.config') }}
          restore-keys: |
            ${{ runner.os }}-open-source-dl-v1-

      - name: Restore C/C++ and Go compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ${{ runner.os }}-open-source-compile-v1-${{ hashFiles('config/source.env', 'config/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-open-source-compile-v1-${{ hashFiles('config/source.env', 'config/feeds.conf') }}-

      - name: Fetch pinned source and prepare packages
        run: bash scripts/prepare.sh

      - name: Verify device and package selection
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make defconfig 2>&1 | tee ../build-info/defconfig.log
          cp .config ../build-info/full.config
          ./scripts/diffconfig.sh > ../build-info/diffconfig
          for symbol in TARGET_mediatek TARGET_mediatek_filogic TARGET_mediatek_filogic_DEVICE_tenda_be12-pro PACKAGE_luci-theme-argon PACKAGE_luci-i18n-base-zh-cn PACKAGE_autocore PACKAGE_kmod-hwmon-core CCACHE PACKAGE_luci-app-openclash PACKAGE_mihomo-meta PACKAGE_firewall4 PACKAGE_dnsmasq-full; do
            grep -Fx "CONFIG_${symbol}=y" .config
          done
          ! grep -Eq '^CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-i18n-nikki-[^=]+)=[ym]$' .config
          bash -n ../scripts/*.sh
          sh -n files/etc/uci-defaults/zzz-be12-pro-custom
          sh -n files/etc/uci-defaults/zzzz-open-source-defaults
          sh -n files/etc/uci-defaults/zzzzz-open-source-network

      - name: Download source archives
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../build-info/download.log

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../build-info/build.log || \
            make -j1 V=s 2>&1 | tee ../build-info/build-retry.log

      - name: Collect and check firmware
        run: |
          set -euo pipefail
          bash scripts/collect.sh open-source
          grep -Eq '^luci-theme-argon ' firmware/*.manifest
          grep -Eq '^autocore ' firmware/*.manifest
          grep -Eq '^kmod-hwmon-core ' firmware/*.manifest
          printf '%s\n' \
            '固件类型：open-source' \
            '默认语言：简体中文' \
            '默认主题：Argon' \
            'DNS 重绑定保护：关闭' \
            'LAN 地址：192.168.1.1' \
            '代理插件：仅 OpenClash，预装 Mihomo 内核，不含 Nikki' \
            '用户名：root' \
            '首次安装默认密码：5689' \
            '2.4GHz：td2 / 12345678a / Wi-Fi 7 EHT20 / 自动信道 / CN' \
            '5GHz：test / 12345678a / Wi-Fi 7 EHT160 / 信道 36 / CN' \
            '无线加密：WPA2-PSK/WPA3-SAE 混合模式' \
            'Dropbear：不绑定接口，GatewayPorts=on' \
            '保留旧配置升级时，已有 root 密码不会被重置。' \
            > firmware/default-settings.txt

      - name: Record compiler cache statistics
        if: always()
        run: |
          if [ -x openwrt/staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache" \
              openwrt/staging_dir/host/bin/ccache --show-stats | tee build-info/ccache-stats.txt
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-source-tenda-be12-pro-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Publish open-source Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.reserve_release_tag.outputs.tag }}
        run: bash scripts/publish-release.sh open-source

      - name: Upload build configuration and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-source-build-info-${{ github.run_number }}
          path: build-info/
          if-no-files-found: warn
          retention-days: 14
