name: Build BE12 Pro - Closed Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-closed.yml'
      - 'config/closed-source/**'
      - 'files/**'
      - 'scripts/prepare-closed.sh'
      - 'scripts/build-closed.sh'
      - 'scripts/build-output.py'
      - 'scripts/collect.sh'
      - 'scripts/collect-closed.sh'
      - 'scripts/publish-release.sh'

permissions:
  contents: write

concurrency:
  group: be12-pro-closed-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}/openwrt
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Linux build environment
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl xz-utils zstd libelf-dev \
            autoconf automake libtool pkgconf libyaml-dev
          df -h

      - name: Restore closed-source download cache
        id: cache_download
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-closed-source-dl-v1-${{ hashFiles('config/closed-source/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-closed-source-dl-v1-${{ hashFiles('config/closed-source/**') }}-
            ${{ runner.os }}-closed-source-dl-v1-

      - name: Restore closed-source compiler caches
        id: cache_compile
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ${{ runner.os }}-closed-source-compile-v1-${{ hashFiles('config/closed-source/source.env', 'config/closed-source/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-closed-source-compile-v1-${{ hashFiles('config/closed-source/source.env', 'config/closed-source/feeds.conf') }}-

      - name: Fetch pinned chasey-dev source and prepare vendor Wi-Fi 7
        run: bash scripts/prepare-closed.sh

      - name: Verify BE12 Pro, vendor drivers and proxy packages
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make defconfig 2>&1 | tee ../build-info/defconfig.log
          cp .config ../build-info/full.config
          ./scripts/diffconfig.sh > ../build-info/diffconfig
          for symbol in TARGET_mediatek TARGET_mediatek_filogic TARGET_MULTI_PROFILE TARGET_DEVICE_mediatek_filogic_DEVICE_tenda_be12-pro DRIVER_11BE_SUPPORT PACKAGE_kmod-mt_wifi7 PACKAGE_kmod-mt_hwifi PACKAGE_kmod-mt7992 PACKAGE_wifi-profile PACKAGE_luci-app-mtwifi-cfg PACKAGE_luci-app-openclash PACKAGE_luci-app-nikki PACKAGE_nikki PACKAGE_mihomo-meta PACKAGE_firewall4 PACKAGE_dnsmasq-full PACKAGE_kmod-mt798x-2p5g-phy PACKAGE_mt798x-2p5g-phy-firmware-internal PACKAGE_kmod-phy-airoha-en8811h PACKAGE_airoha-en8811h-firmware CCACHE; do
            grep -Fx "CONFIG_${symbol}=y" .config
          done
          ! grep -Eq '^CONFIG_TARGET_DEVICE_.*routerich.*=y$' .config
          bash -n ../scripts/*.sh
          sh -n files/etc/uci-defaults/zzz-be12-pro-custom

      - name: Download source archives and vendor driver archives
        id: download
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j8 V= 2>&1 | tee ../build-info/download.log

      - name: Compile closed-source firmware
        id: compile
        run: bash scripts/build-closed.sh

      - name: Save closed-source downloads and Go modules
        if: always() && steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-closed-source-dl-v1-${{ hashFiles('config/closed-source/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save closed-source compiler caches even if later steps fail
        if: always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ${{ runner.os }}-closed-source-compile-v1-${{ hashFiles('config/closed-source/source.env', 'config/closed-source/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Back up raw compiled firmware before verification
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: closed-source-raw-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*tenda_be12-pro*.bin
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/profiles.json
            openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Collect and verify installed packages inside closed-source firmware
        run: bash scripts/collect-closed.sh

      - name: Record closed-source compiler cache statistics
        if: always()
        run: |
          if [ -x openwrt/staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache" \
              openwrt/staging_dir/host/bin/ccache --show-stats | tee build-info/ccache-stats.txt
          fi

      - name: Upload closed-source firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: closed-source-tenda-be12-pro-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Publish closed-source Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh closed-source

      - name: Upload closed-source build configuration and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: closed-source-build-info-${{ github.run_number }}
          path: build-info/
          if-no-files-found: warn
          retention-days: 14
